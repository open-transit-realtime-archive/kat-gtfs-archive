name: GTFS-RT Collector

on:
  workflow_dispatch: # Triggered via API by cron-job.org or manual runs
  push:
    branches: [ main ]
    
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests boto3

      - name: Run Collector and Upload to B2
        env:
          B2_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}
          B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
        run: python collector.py
